# Reference manifest for the workshop agent.
# Build it with the Create Environment form (see README.md), then compare the
# manifest DigitalOcean shows you with this one. Never put a real key in this file.
name: my-agent
agent: hermes
size: mars-1vcpu-1gb
env:
  HARNESS_INFERENCE_MODEL: kimi-k3        # any open model from the list works
secrets:
  HARNESS_INFERENCE_API_KEY: {}         # leave as {}: tells DigitalOcean to create the key and give it to the agent
egress:
  allow_hosts:
    - pypi.org                            # the fence: no other direct internet
permissions:
  default: allow
tools:
  - do.actions:
      tools:
        - brightdata_web_fetch
        - brightdata_web_search
        # - slack_post_message            # add only if you did optional step 3
      preload_tools:
        - brightdata_web_fetch
        - brightdata_web_search
